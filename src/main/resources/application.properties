spring.application.name=taskflow-api
server.port=8080

# Spring AI - OpenRouter through the OpenAI-compatible starter (lesson 3.12).
# The key is read from the environment; it must never appear in this file.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.chat.temperature=0.3
# Only chat is used; skip the embedding auto-configuration that the starter also offers
spring.ai.model.embedding=none

# CORS: origins allowed to call /api/** from a browser (the task-manager Vite dev server)
taskflow.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Logging
logging.level.sg.edu.ntu=INFO
